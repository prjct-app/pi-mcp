name: Check

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - run: npm audit

  native-keyring:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install private Linux keyring test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring libglib2.0-bin
      - run: npm run test:keyring
      - name: Reproduce the legacy Linux fallback defect
        if: runner.os == 'Linux'
        run: npm run test:keyring -- --reproduce-legacy-loss
